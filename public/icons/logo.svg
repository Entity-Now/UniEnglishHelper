<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Glowing Backlight -->
    <radialGradient id="glowGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- U Stroke Gradient (Cyan -> Sky Blue -> Violet) -->
    <linearGradient id="uGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- E Stroke Gradient (Coral -> Vivid Rose -> Amber Gold) -->
    <linearGradient id="eGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <!-- Sparkle Star Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Outer Squircle Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.4" />
    </linearGradient>

    <!-- Top Specular Gloss Highlight -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#glowGrad)" />

  <!-- 2. Subtle Glowing Border -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="3" />

  <!-- 3. Top Specular Gloss -->
  <path d="M 24 132 C 24 72, 72 24, 132 24 L 380 24 C 440 24, 488 72, 488 132 C 488 200, 360 220, 256 220 C 152 220, 24 200, 24 132 Z" fill="url(#glossGrad)" />

  <!-- 4. Main Glyph: Interlocking U + E Fluid Ribbon -->
  <g filter="url(#dropShadow)">
    <!-- Left U Arm -->
    <path d="M 148 140 
             L 148 270 
             C 148 350, 204 396, 276 396 
             C 348 396, 404 350, 404 270
             L 404 240
             C 404 220, 376 220, 376 240
             L 376 270
             C 376 332, 332 366, 276 366
             C 220 366, 176 332, 176 270
             L 176 140
             C 176 120, 148 120, 148 140 Z" 
          fill="url(#uGrad)" />

    <!-- E Cross & Inner Spine Ribbon -->
    <path d="M 220 220 
             L 372 220 
             C 388 220, 388 194, 372 194 
             L 248 194 
             C 216 194, 196 216, 196 248
             L 196 288
             C 196 320, 216 342, 248 342
             L 372 342
             C 388 342, 388 316, 372 316
             L 248 316
             C 232 316, 224 308, 224 296
             L 224 276
             L 348 276
             C 362 276, 362 252, 348 252
             L 224 252
             L 224 236
             C 224 226, 228 220, 236 220 Z" 
          fill="url(#eGrad)" />

    <!-- Soundwave Audio Bars & Subtitle Capsule -->
    <g transform="translate(196, 136)">
      <!-- Left sound bar -->
      <rect x="14" y="24" width="6" height="20" rx="3" fill="#38bdf8" opacity="0.85" />
      <!-- Center voice wave bar -->
      <rect x="26" y="14" width="6" height="40" rx="3" fill="#67e8f9" />
      <!-- Mid-right sound bar -->
      <rect x="38" y="20" width="6" height="28" rx="3" fill="#38bdf8" opacity="0.9" />
      <!-- Small outer sound bar -->
      <rect x="50" y="27" width="6" height="14" rx="3" fill="#818cf8" opacity="0.75" />
    </g>

    <!-- 5. Brilliant Sparkle Star (AI & Bilingual Intelligence Beacon) -->
    <g transform="translate(352, 116)" filter="url(#neonGlow)">
      <!-- Sparkle 4-point star -->
      <path d="M 32 0 
               C 32 18, 46 32, 64 32 
               C 46 32, 32 46, 32 64 
               C 32 46, 18 32, 0 32 
               C 18 32, 32 18, 32 0 Z" 
            fill="url(#starGrad)" />
      <circle cx="32" cy="32" r="6" fill="#ffffff" />
    </g>
  </g>
</svg>
